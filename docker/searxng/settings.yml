use_default_settings: true

general:
  # Wikipedia, Wikidata and OpenStreetMap refuse to load without an operator
  # contact, which goes in their User-Agent. Deliberately generic.
  contact_url: https://github.com

search:
  formats:
    - html
    - json
    - csv

engines:
  # Firecrawl leaves SEARXNG_ENGINES empty, so this list decides what it uses.
  # SearXNG merges and ranks results across every engine that answers, so a
  # broad pool is best. Blocked or rate-limited engines are suspended and
  # skipped on their own. Results depend on the egress IP (the Mullvad exit).
  - name: google
    disabled: false
    weight: 1.5
  - name: yandex
    disabled: false
    weight: 1.3
  - name: mojeek
    disabled: false
    inactive: false  # upstream marks it inactive over a proof-of-work captcha; works from this exit
    weight: 1.2
  - name: duckduckgo
    disabled: false
    weight: 1.1
  - name: yahoo
    disabled: false
    weight: 1.0
  - name: ayo
    disabled: false
    inactive: false
    weight: 0.9
  - name: qwant
    disabled: false
    weight: 0.8
  - name: seznam
    disabled: false
    weight: 0.8
  - name: wikipedia  # article lookup; "list" makes it a normal result Firecrawl can use
    disabled: false
    display_type: [list]
    weight: 1.0
  # Disabled because they make results worse:
  - name: bing  # returns results for only the first word of multi-word queries (searxng#4964)
    disabled: true
  - name: brave  # cloaked redirect URLs that Firecrawl can't scrape (searxng#6971)
    disabled: true
  - name: startpage  # Anubis challenge; parsing errors
    disabled: true
  - name: google cse  # no CSE id configured; always rate-limited
    disabled: true
  - name: wikidata  # only produces infoboxes, which Firecrawl ignores
    disabled: true

# Drop results that point back into a search engine (Ayo sometimes returns its
# own aggregation pages); Firecrawl can't use them.
hostnames:
  remove:
    - '(.*\.)?search\.ayo\.de$'

server:
  secret_key: "firecrawl-searxng-local"
